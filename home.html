<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syun's Website</title>

<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Splash Screen */
.splash-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#7851A9;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeOut 0.5s ease-in-out 2s forwards;
}

.splash-logo{
    font-size:3rem;
    font-weight:bold;
    color:yellow;
    animation:scaleUp 0.5s ease-in-out;
}

@keyframes fadeOut{
    from{
        opacity:1;
        visibility:visible;
    }
    to{
        opacity:0;
        visibility:hidden;
    }
}

@keyframes scaleUp{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* Main Page */
body{
    background-color:#E0115F;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
}

.container{
    text-align:center;
}

h1{
    color:white;
    margin-bottom:30px;
}

.typing1,
.typing2{
    display:inline-block;
    overflow:hidden;
    white-space:nowrap;
    width:0;
}

.typing1{
    animation:typing 2s steps(10,end) forwards;
}

.typing2{
    animation:typing 2s steps(14,end) forwards;
    animation-delay:2.2s;
}

@keyframes typing{
    from{width:0;}
    to{width:100%;}
}

/* Start Button */
.start-btn{
    display:inline-block;
    margin-top:20px;
    font-size:20px;
    background:pink;
    color:white;
    padding:10px 30px;
    text-decoration:none;
    border-radius:5px;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- Splash Screen -->
<div class="splash-screen">
    <div class="splash-logo">SYUN</div>
    <p>Loading...</p>
</div>

<!-- Main Content -->
<div class="container">
    <h1>
        <span class="typing1">Welcome to</span><br>
        <span class="typing2">Syun's Website</span>
    </h1>

    <a style="background-color:purple" class="start-btn" href="start.html">Start</a>
</div>

</body>
</html>
